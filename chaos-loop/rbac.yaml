apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-hook
  namespace: chaos-loop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-hook
  namespace: chaos-loop
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-hook
  namespace: chaos-loop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-hook
subjects:
  - kind: ServiceAccount
    name: chaos-hook
    namespace: chaos-loop
