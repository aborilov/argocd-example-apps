apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-breaker
  namespace: chaos-loop
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: chaos-hook
      restartPolicy: Never
      containers:
        - name: breaker
          image: bitnami/kubectl:latest
          command:
            - kubectl
            - delete
            - configmap
            - chaos-target
            - -n
            - chaos-loop
